<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Brand SerraAthlo: gradiente laranja com S estilizado.
       Mantém área segura de 64px nas bordas (safe zone do maskable). -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a5a"/>
      <stop offset="100%" stop-color="#ff5a3c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="96"/>
  <rect width="512" height="512" fill="url(#shine)" rx="96"/>
  <!-- Halter estilizado pra remeter ao app de treino -->
  <g fill="#ffffff" transform="translate(96, 96)">
    <!-- Barra central -->
    <rect x="60" y="148" width="200" height="24" rx="6"/>
    <!-- Pesos esquerdos -->
    <rect x="20" y="100" width="34" height="120" rx="10"/>
    <rect x="0" y="124" width="20" height="72" rx="6"/>
    <!-- Pesos direitos -->
    <rect x="266" y="100" width="34" height="120" rx="10"/>
    <rect x="300" y="124" width="20" height="72" rx="6"/>
  </g>
  <!-- Label SERRA pequeno embaixo -->
  <text x="256" y="412" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-weight="900" font-size="56" fill="#ffffff" letter-spacing="2">
    SERRA
  </text>
</svg>
