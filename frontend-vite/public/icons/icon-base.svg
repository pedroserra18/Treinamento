<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícone SerraAthlo: montanhas vermelhas com seta de progressão.
       Versão SVG aproximada da logo Logo_sem_Fundo.png — usada como
       fonte pelo pwa-assets-generator pra produzir PNGs em todos os
       tamanhos. Mantém só o símbolo (sem texto SERRAATHLO) pra ficar
       legível em ícone pequeno do iOS (180px). -->
  <defs>
    <linearGradient id="rb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1f2d"/>
      <stop offset="100%" stop-color="#dc1422"/>
    </linearGradient>
  </defs>
  <!-- Fundo branco arredondado (estilo iOS) -->
  <rect width="512" height="512" fill="#ffffff" rx="96"/>

  <!-- Conjunto de 3 picos de montanha + seta de subida.
       Centro do desenho em (256, 280). Escala generosa pra ocupar
       a maior parte do quadrado, com margem de respiro. -->
  <g transform="translate(256, 280)">
    <!-- Pico esquerdo (atrás) -->
    <path d="M -180 100 L -85 -55 L -10 80 L -10 100 Z" fill="url(#rb)"/>
    <!-- Pico direito (atrás) -->
    <path d="M 10 80 L 90 -50 L 180 100 L 10 100 Z" fill="url(#rb)"/>
    <!-- Recorte branco do "V" entre os picos pra dar profundidade -->
    <path d="M -25 100 L 0 65 L 25 100 Z" fill="#ffffff"/>
    <!-- Pico central — pequeno triângulo escuro que sobe do meio -->
    <path d="M -38 100 L 0 -10 L 38 100 Z" fill="url(#rb)"/>

    <!-- Seta de subida saindo do meio pra cima-direita.
         Composta de uma linha grossa + ponta triangular. -->
    <!-- Linha da seta -->
    <path d="M -10 0 L 45 -130 L 65 -120 L 10 10 Z" fill="url(#rb)"/>
    <!-- Cabeça da seta -->
    <path d="M 75 -148 L 22 -148 L 38 -110 L 30 -98 L 78 -100 Z" fill="url(#rb)"/>
  </g>
</svg>
